name: Fabricated numerical diagnosis
on: [workflow_dispatch]
jobs:
  diagnosis:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: current
            python: '3.14.4'
            numpy: '2.5.2'
            scipy: '1.18.0'
          - name: expectation-freeze
            python: '3.13.13'
            numpy: '2.4.4'
            scipy: '1.17.1'
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy==${{ matrix.numpy }} scipy==${{ matrix.scipy }} jsonschema==4.25.1 threadpoolctl==3.7.0
      - run: |
          python -m pip freeze > numerical-environment.txt
          python numerical_qc/reproduce.py --repo . --output original.json
          python numerical_qc/reproduce.py --repo . --output central-diagnostic.json --jac 3-point
      - uses: actions/upload-artifact@v4
        with:
          name: numeric-${{ matrix.name }}
          path: |
            original.json
            central-diagnostic.json
            numerical-environment.txt
