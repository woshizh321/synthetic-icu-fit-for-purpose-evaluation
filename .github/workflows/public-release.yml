name: Public reproducibility checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  public-tests:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q tests
      - run: python reproduction/verify_public_release.py
